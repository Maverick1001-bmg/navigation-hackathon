name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: No conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|>>>>>>>)( |$)' -- ':!*.md'; then
            echo "Conflict markers found"; exit 1
          fi

      - name: No obvious secrets
        run: |
          if git grep -nE '(sk-[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{35}|ghp_[A-Za-z0-9]{36})'; then
            echo "Possible API key committed"; exit 1
          fi

      - uses: actions/setup-node@v4
        if: hashFiles('**/package.json') != ''
        with:
          node-version: 20

      # Builds every package that has a build script. Keep it fast; skip if it slows you down.
      - name: Install & build
        if: hashFiles('**/package.json') != ''
        run: |
          for dir in $(git ls-files '*package.json' | grep -v node_modules | xargs -n1 dirname); do
            if grep -q '"build"' "$dir/package.json"; then
              echo "::group::$dir"
              (cd "$dir" && (npm ci || npm install) && npm run build) || exit 1
              echo "::endgroup::"
            fi
          done
